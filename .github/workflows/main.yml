on: [push, pull_request]
name: ci
jobs:
  check-pr:
    name: validate commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0
    - run: git fetch origin master
    - uses: flux-framework/pr-validator@master

  ci-checks:
    name: make check (Lua ${{ matrix.lua }})
    # Ubuntu 26.04 is the first release to package Lua 5.5
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        lua: ['5.1', '5.2', '5.3', '5.4', '5.5']
        include:
        # The Lua 5.1 development package has a different naming scheme
        - lua: '5.1'
          dev: liblua5.1-0-dev
    steps:
    - name: checkout
      uses: actions/checkout@v6
    - name: install lua
      run: |
        sudo apt-get update
        sudo apt-get install -yy lua${{ matrix.lua }} \
            ${{ matrix.dev || format('liblua{0}-dev', matrix.lua) }}
    - name: make check
      run: make check LUA=lua${{ matrix.lua }} CFLAGS=-Werror
    - name: make install
      run: |
        make install LUA=lua${{ matrix.lua }} DESTDIR=$(pwd)/inst
        test -x inst/usr/local/lib/lua/${{ matrix.lua }}/hostlist.so
        test -x inst/usr/local/bin/hostlist
